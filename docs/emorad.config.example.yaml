    - jakarta.
    - jstl-
    - standard-

    # Web 容器 / Servlet
    - servlet-
    - jsp-
    - tomcat-
    - jetty-
    - undertow-

    # AOP / 字节码 / 反射
    - aspectj-
    - cglib-
    - asm-
    - javassist-
    - byte-buddy-

    # 安全与认证
    - shiro-
    - spring-security-
    - oauth-
    - jwt-
    - cas-

    # 测试框架
    - junit-
    - mockito-
    - hamcrest-
    - assertj-

  # 业务 JAR 关键词：命中后会在 WEB-INF/lib / APP-INF/lib 中优先保留
  app_jar_hints:
    - sso
    - client
    - sword
    - j_sso_server
    - biz
    - business
    - core
    - service
    - api

  # 强制保留（最高优先级，等价于命令行 -j）
  jar_include:
    - sso_client
    - sword-sso-client

  # 可选：如果误过滤了业务包，可在这里追加更精确关键词（按需维护）
  # jar_include:
  #   - your-company-app
  #   - your-team-module
